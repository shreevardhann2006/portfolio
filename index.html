<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio of a Full Stack Developer">
    <title>Portfolio | Full Stack Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Syne:wght@400;600;700;800&family=Cinzel+Decorative:wght@700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="sections.css">
</head>

<body class="dark-theme gateway-active">
    <!-- Preloader -->
    <div id="preloader">
        <div class="loader-content">
            <span class="loader-text">Loading</span>
            <div class="loader-bar"></div>
        </div>
    </div>

    <!-- Gateway Overlay (Starting Page) -->
    <div id="pathway-gateway" class="pathway-section">
        <div class="container text-center">
            <span class="pathway-subtitle">SHREEVARDHANN A.</span>
            <h2 class="pathway-title">Choose how you'd like to know me.</h2>
            
            <div class="pathway-cards">
                <!-- Recruiter Card -->
                <div class="pathway-card" onclick="enterPortfolio('recruiter')">
                    <div class="card-glow glow-cyan"></div>
                    <h3 class="serif-title">Are you a recruiter?</h3>
                    <p>Projects, experience, and the work I love building.</p>
                    <div class="circle-btn"><i class="fa-solid fa-arrow-right"></i></div>
                </div>

                <!-- Visitor Card -->
                <div class="pathway-card" onclick="enterPortfolio('visitor')">
                    <div class="card-glow glow-green"></div>
                    <h3 class="serif-title">Are you a curious<br>visitor or a potential<br>teammate?</h3>
                    <p>Stories, memories, and the person behind the code.</p>
                    <div class="circle-btn"><i class="fa-solid fa-arrow-right"></i></div>
                </div>
            </div>
        </div>
    </div>
    <!-- Particles Background -->
    <div id="particles-js"></div>

    <!-- Light Trails Animation (from futuristic theme) -->
    <div id="light-trails"></div>

    <div class="cursor-dot" data-cursor-dot></div>
    <div class="cursor-outline" data-cursor-outline></div>

    <!-- CDNs for Animations -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <script src="script.js"></script>
</body>

</html>
